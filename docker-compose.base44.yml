services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - DATABASE_PATH=/data/research.db
    volumes:
      - .:/app
      - app_data:/data
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_data:
